    <style>
    body {
      background: linear-gradient(black, purple, white);
      background-image: url("/pics/weather/clouds 1.png"), linear-gradient(black, purple, white);
      background-color: rgba(255,255,255,.1);
      background-blend-mode: lighten, normal;
      background-repeat: no-repeat;
      background-position: 50% 50%;
      background-size: 80%, 100%;
      color: white;
      min-height: 100vh;
    }
    .container {
      background: rgba(0,0,0,.4);
    }
    .tooltip {
      position: relative;
      display: inline-block;
      border-bottom: 1px dotted black; /* If you want dots under the hoverable text */
    }
    
    /* Tooltip text */
    .tooltip .tooltiptext {
      visibility: hidden;
      width: 120px;
      background-color: #555;
      color: #fff;
      text-align: center;
      padding: 5px 0;
      border-radius: 6px;
    
      /* Position the tooltip text */
      position: absolute;
      z-index: 1;
      bottom: 125%;
      left: 50%;
      margin-left: -60px;
    
      /* Fade in tooltip */
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    /* Tooltip arrow */
    .tooltip .tooltiptext::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: #555 transparent transparent transparent;
    }
    
    /* Show the tooltip text when you mouse over the tooltip container */
    .tooltip:hover .tooltiptext {
      visibility: visible;
      opacity: .9;
    }
    
    ul.topnav {
      display: flex;
      list-style-type: none;
      border-radius: 50px;
      border-color: aliceblue;
      color: antiquewhite;
      background-color: rgb(34, 31, 35);
    }
    ul.topnav li {
      background-color: rgb(49, 44, 53);
      display: block;
      padding: 10px 20px;
      margin: 5px 5px;
      border-radius: 5px;
    }
    ul.topnav li a:hover {
      background-color: lightpink;
      color: mediumvioletred;
    }
    ul.topnav li:hover {
      background-color: lightpink;
      color: mediumvioletred;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      background-color: rgb(253, 209, 216);
      border-radius: 5px;
      min-width: 160px;
      padding: 10px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 1;
    }

    /* Show the dropdown menu (use JS to add this class to the .dropdown-content container when the user clicks on the dropdown button) */
    .show {display:block;}
    </style>
  </head>
  <body>

      <li class="dropdown" onclick="listToggle('blogs')">

        <div id="blogs" class="dropdown-content">

      </li>

      <li><a href="https://loopifer.atabook.org/" target="_blank" rel="noopener noreferrer">Guestbook 📝</a></li>

    </div>

    <div class="heading"><h1 text-align="center">Loopislost</h1></div>

    <script>
      function listToggle(navID) {
        document.getElementById(navID).classList.toggle("show");
      }
